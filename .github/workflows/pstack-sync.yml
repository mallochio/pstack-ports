name: Sync pstack ports with upstream

on:
  schedule:
    # Weekly, Sundays 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch upstream and report drift
        id: drift
        run: |
          # --fetch populates .upstream/; --check diffs the regenerated
          # output against the committed tree (nothing written).
          python3 port.py --fetch --check > drift.txt
          cat drift.txt
          {
            echo 'report<<EOF'
            cat drift.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Rebuild ports from fetched upstream
        run: python3 port.py   # reuses the .upstream/ cache, no re-download

      - name: Create or update sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/pstack-sync
          delete-branch: true
          title: "chore: sync pstack ports with upstream"
          commit-message: "chore: re-port pstack from upstream"
          body: |
            Re-generated `opencode/` and `prime-agent/` from the latest
            upstream `cursor/plugins` `pstack/` subtree (see `UPSTREAM` for
            the exact commit).

            ### Drift report
            ```
            ${{ steps.drift.outputs.report }}
            ```

            Generated by `python3 port.py --fetch`. Hand-edits to generated
            files get clobbered by design — patch via `overrides/<target>/`
            instead.
          labels: upstream-sync
